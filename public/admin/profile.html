<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Si-Mbah</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../css/admin.css">

</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-header">
                    <a href="../index.html" class="sidebar-logo">
                        <img src="../favicon.png" alt="Si-Mbah Logo">
                        <span>Si-Mbah</span>
                    </a>
                </div>
                <nav class="sidebar-nav">
                    <a href="#" class="nav-item active">
                        <i data-feather="layout"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="#" class="nav-item">
                        <i data-feather="book-open"></i>
                        <span>Herbalpedia</span>
                    </a>
                    <a href="#" class="nav-item">
                        <i data-feather="file-text"></i>
                        <span>Referensi</span>
                    </a>
                </nav>
            </div>
            <div class="sidebar-bottom">
                <div class="user-profile">
                    <div id="admin-avatar-sidebar" class="profile-avatar"></div>
                    <div class="profile-info">
                        <span id="admin-name-sidebar" class="profile-name">Loading...</span>
                        <span class="profile-role">Admin</span>
                    </div>
                </div>
                <button class="btn-logout">
                    <i data-feather="log-out"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <button class="sidebar-toggle" id="sidebar-toggle">
                    <i data-feather="menu"></i>
                </button>
                <div class="header-actions">
                    <button class="action-button"><i data-feather="bell"></i></button>
                </div>
            </header>

            <div class="page-content">
                <div class="welcome-header">
                    <h1 id="welcome-message">Selamat Datang, Admin!</h1>
                    <p>Berikut adalah ringkasan data dari sistem Si-Mbah.</p>
                </div>
                
                <section class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon-wrapper">
                            <i data-feather="users"></i>
                        </div>
                        <div class="stat-content">
                            <span class="stat-label">Total Pengguna</span>
                            <span class="stat-number" id="total-users">-</span>
                        </div>
                    </div>
                     <div class="stat-card">
                        <div class="stat-icon-wrapper">
                            <i data-feather="feather"></i>
                        </div>
                        <div class="stat-content">
                            <span class="stat-label">Tanaman Herbal</span>
                            <span class="stat-number" id="total-plants">-</span>
                        </div>
                    </div>
                     <div class="stat-card">
                        <div class="stat-icon-wrapper">
                           <i data-feather="book"></i>
                        </div>
                        <div class="stat-content">
                            <span class="stat-label">Jurnal Referensi</span>
                            <span class="stat-number" id="total-journals">-</span>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="httpshttps://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
