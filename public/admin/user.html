<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengguna - Admin</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/herbal.css" />
  <link rel="stylesheet" href="../css/users.css" />
</head>
<body>
  <div class="admin-layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <a href="../index.html" class="sidebar-logo">
            <img src="../favicon.png" alt="Si-Mbah Logo">
            <span>Si-Mbah</span>
          </a>
        </div>
        <nav class="sidebar-nav">
          <a href="./profile.html" class="nav-item">
            <i data-feather="layout"></i>
            <span>Dashboard</span>
          </a>
          <a href="#" class="nav-item active">
            <i data-feather="users"></i>
            <span>Pengguna</span>
          </a>
          <a href="./herbalpedia.html" class="nav-item">
            <i data-feather="book-open"></i>
            <span>Herbalpedia</span>
          </a>
          <a href="./referensi.html" class="nav-item">
            <i data-feather="file-text"></i>
            <span>Referensi</span>
          </a>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <div class="user-profile">
          <div id="admin-avatar-sidebar" class="profile-avatar"></div>
          <div class="profile-info">
            <span id="admin-name-sidebar" class="profile-name">Loading...</span>
            <span class="profile-role">Admin</span>
          </div>
        </div>
        <button class="btn-logout">
          <i data-feather="log-out"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="main-header">
        <button class="sidebar-toggle" id="sidebar-toggle">
          <i data-feather="menu"></i>
        </button>
      </header>

      <div class="page-content">
        <div class="welcome-header">
          <h1>Pengguna</h1>
          <p>Kelola daftar pengguna sistem. Edit atau hapus bila diperlukan.</p>
        </div>

        <section class="card">
          <div id="users-grid" class="cards-grid"></div>
          <div class="pagination" id="users-pagination"></div>
        </section>
      </div>
    </main>
  </div>

  <div class="modal" id="user-edit-modal" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Edit Pengguna</h3>
        <button class="modal-close" data-close>
          <i data-feather="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="user-edit-form">
          <input type="hidden" id="user-edit-id" />
          <div class="form-group">
            <label for="user-edit-name">Nama</label>
            <input type="text" id="user-edit-name" required />
          </div>
          <div class="form-group">
            <label for="user-edit-role">Role</label>
            <select id="user-edit-role">
              <option value="user">user</option>
              <option value="admin">admin</option>
            </select>
          </div>
          <div class="form-group">
            <label>Terverifikasi</label>
            <div class="toggle-field">
              <label class="switch">
                <input type="checkbox" id="user-edit-verified" />
                <span class="slider"></span>
              </label>
              <span id="verified-status" class="help-text">Tidak</span>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" data-close>Batal</button>
        <button class="btn-primary" id="user-save-edit">Simpan</button>
      </div>
    </div>
  </div>

  <script src="../js/admin.js"></script>
  <script src="../js/users.js"></script>
</body>
</html>
